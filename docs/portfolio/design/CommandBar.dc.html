<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Cascadia+Code:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2f2f2;text-decoration:none}a:hover{color:#ffffff}
input::placeholder{color:#9d9d9d}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0c0c0c; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'IBM Plex Sans', system-ui, sans-serif; color: #f2f2f2;">

<!-- page behind, dimmed -->
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 152px; display: flex; flex-direction: column; gap: 72px;">
<div style="display: flex; justify-content: space-between; font-family: 'Cascadia Code', Consolas, 'JetBrains Mono', ui-monospace, monospace; font-weight: 700;"><span>~/sam-mishin_</span><span style="color: #9d9d9d; font-weight: 400; font-size: 14px;">./work ./experience ./skills ./contact</span></div>
<div style="display: flex; flex-direction: column; gap: 24px;"><span style="font-family: 'Cascadia Code', Consolas, 'JetBrains Mono', ui-monospace, monospace; color: #9d9d9d;">$ whoami</span><span style="font-size: 56px; font-weight: 700; max-width: 900px; line-height: 1.08;">I build software that real businesses run on.</span></div>
<div style="height: 380px; border: 1px solid #3a3a3a; border-radius: 14px; background: #1c1c1c;"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(1,4,9,0.72);"></div>

<!-- palette -->
<div role="dialog" aria-label="Command bar" style="position: absolute; left: 50%; top: 120px; width: 640px; margin-left: -320px; border: 1px solid #3a3a3a; border-radius: 8px; background: #2c2c2c; box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden; font-family: 'Cascadia Code', Consolas, 'JetBrains Mono', ui-monospace, monospace;">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 60px; border-bottom: 1px solid #3a3a3a;">
<span style="color: #9d9d9d; font-size: 18px;">&gt;</span>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Type a command</span>
<input type="text" value="{{query}}" onChange="{{onQuery}}" placeholder="Type a command or search…" autofocus style="flex: 1; height: 100%; border: 0; outline: none; background: transparent; color: #f2f2f2; font-family: inherit; font-size: 16px;">
<kbd style="font-family: inherit; font-size: 12px; color: #9d9d9d; border: 1px solid #3a3a3a; border-radius: 4px; padding: 2px 6px;">esc</kbd>
</label>

<div style="max-height: 470px; overflow-y: auto; padding: 8px;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="padding: 10px 10px 6px; font-size: 11px; letter-spacing: 0.08em; color: #9d9d9d;">{{g.name}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<sc-if value="{{it.active}}" hint-placeholder-val="{{false}}">
<a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; font-size: 14px; background: #404040; color: #ffffff;">
<span style="width: 22px; color: #60cdff;">{{it.icon}}</span>
<span style="flex: 1;">{{it.label}}</span>
<span style="color: #cccccc; font-size: 12px;">{{it.hint}}  ↵</span>
</a>
</sc-if>
<sc-if value="{{it.idle}}" hint-placeholder-val="{{true}}">
<a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: #cccccc;">
<span style="width: 22px; color: #9d9d9d;">{{it.icon}}</span>
<span style="flex: 1;">{{it.label}}</span>
<span style="color: #9d9d9d; font-size: 12px;">{{it.hint}}</span>
</a>
</sc-if>
</sc-for>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 28px 16px; color: #9d9d9d; font-size: 14px;">command not found: {{query}} — try <span style="color: #f2f2f2;">help</span></div>
</sc-if>
</div>

<div style="display: flex; gap: 20px; padding: 10px 18px; border-top: 1px solid #3a3a3a; font-size: 12px; color: #9d9d9d;">
<span>↑↓ navigate</span><span>↵ open</span><span>esc close</span><span style="margin-left: auto;">try: winfetch · sudo hire sam</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { query: "" }; }
renderVals() {
const q = (this.state.query || "").trim().toLowerCase();
const all = [
{ name: "PAGES", items: [
{ label: "cd ~/work", hint: "Selected work", icon: "▸", href: "Main.dc.html#work" },
{ label: "cd ~/experience", hint: "git log --career", icon: "▸", href: "Main.dc.html#experience" },
{ label: "cd ~/contact", hint: "Email, LinkedIn, GitHub", icon: "▸", href: "Main.dc.html#contact" }
]},
{ name: "PROJECTS", items: [
{ label: "open trellis", hint: "Wine club billing", icon: "◆", href: "Project.dc.html" },
{ label: "open spend-tracker", hint: "Clover → Postgres", icon: "◆", href: "Project.dc.html" },
{ label: "open cash-drawer", hint: "Count reconciliation", icon: "◆", href: "Project.dc.html" },
{ label: "open chess-variant", hint: "Hand-written · GitHub", icon: "◆", href: "https://github.com/sam-mishin/Chess-Variant" }
]},
{ name: "ACTIONS", items: [
{ label: "cp email", hint: "mishinsam2@gmail.com", icon: "⎘", href: "mailto:mishinsam2@gmail.com" },
{ label: "wget resume.pdf", hint: "Download résumé", icon: "↓", href: "#resume" },
{ label: "theme --toggle", hint: "Light / dark", icon: "◐", href: "StyleGuide.dc.html" },
{ label: "winfetch", hint: "Show the profile card", icon: "$", href: "Main.dc.html" },
{ label: "sudo hire sam", hint: "Permission granted", icon: "$", href: "mailto:mishinsam2@gmail.com" }
]}
];
let first = true;
const groups = all.map(g => ({
name: g.name,
items: g.items.filter(it => !q || it.label.includes(q) || it.hint.toLowerCase().includes(q)).map(it => {
const active = first; first = false;
return { ...it, active, idle: !active };
})
})).filter(g => g.items.length);
return {
query: this.state.query,
onQuery: (e) => this.setState({ query: e.target.value }),
groups,
empty: groups.length === 0
};
}
}
</script>
</body>
</html>
